<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Restaurant CMS</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#f5f5f5;
}

header{
height:70px;
background:#222;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
}

.container{
display:flex;
height:calc(100vh - 70px);
}

aside{
width:250px;
background:#fff;
border-left:1px solid #ddd;
padding:20px;
}

aside button{

width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:10px;
cursor:pointer;
background:#f2f2f2;
font-size:16px;

}

aside button:hover{

background:#111;
color:white;

}

main{

flex:1;
padding:25px;
overflow:auto;

}

.card{

background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

table{

width:100%;
border-collapse:collapse;

}

th,td{

padding:12px;
border-bottom:1px solid #eee;
text-align:center;

}

img{

width:70px;
border-radius:8px;

}

</style>

</head>

<body>

<header>

<h2>Restaurant CMS</h2>

<div id="restaurantName">Loading...</div>

</header>

<div class="container">

<aside>

<button onclick="loadProducts()">🍔 المنتجات</button>

<button onclick="loadCategories()">📂 الأقسام</button>

<button onclick="loadRestaurant()">🏪 بيانات المطعم</button>

<button onclick="loadTheme()">🎨 التصميم</button>

</aside>

<main id="content">

<div class="card">

<h2>مرحباً بك</h2>

<br>

اختر من القائمة.

</div>

</main>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbwMxCA3oVEQNrpic7aoEIXRRtqQv68jFRZqaOBqeQ862stZy3musgcXM_jU6uHy0sXlUA/exec";

async function api(action){

const r=await fetch(API+"?action="+action);

return await r.json();

}

async function loadProducts(){

const json=await api("getProducts");

let html=`

<div class="card">

<h2>المنتجات</h2>

<br>

<table>

<tr>

<th>ID</th>

<th>الصنف</th>

<th>السعر</th>

<th>متاح</th>

</tr>

`;

json.data.forEach(p=>{

html+=`

<tr>

<td>${p.id}</td>

<td>${p.name_ar}</td>

<td>${p.base_price}</td>

<td>${p.available}</td>

</tr>

`;

});

html+=`</table></div>`;

content.innerHTML=html;

}

async function loadCategories(){

const json=await api("getCategories");

let html=`<div class="card"><h2>الأقسام</h2><br><table>

<tr>

<th>ID</th>

<th>الاسم</th>

</tr>`;

json.data.forEach(c=>{

html+=`

<tr>

<td>${c.id}</td>

<td>${c.name_ar}</td>

</tr>

`;

});

html+="</table></div>";

content.innerHTML=html;

}

async function loadRestaurant(){

const json=await api("getRestaurantInfo");

restaurantName.innerHTML=json.data[0]?.restaurant_name_ar||"Restaurant";

content.innerHTML="<div class='card'><pre>"+JSON.stringify(json.data,null,2)+"</pre></div>";

}

async function loadTheme(){

const json=await api("getTheme");

content.innerHTML="<div class='card'><pre>"+JSON.stringify(json.data,null,2)+"</pre></div>";

}

loadRestaurant();

</script>

</body>
</html>
